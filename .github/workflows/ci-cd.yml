name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Type checking
        run: pnpm exec tsc --noEmit

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Linting
        run: pnpm lint

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Run Vitest unit tests
        run: pnpm test:unit

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [type-check, lint, unit-tests]
    # tests/global-setup.ts calls process.exit(1) unless these are present, so the
    # job could never pass without them. The `secrets` context is not available in
    # `if:` expressions, so the secrets are surfaced as job-level `env` (which is)
    # and the steps below are gated on them. Without secrets the job still runs
    # and reports the skip loudly instead of failing every build.
    env:
      PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
      PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
      PLAYWRIGHT_TEST_USER_ID: ${{ secrets.PLAYWRIGHT_TEST_USER_ID }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
    steps:
      - name: Report e2e status
        run: |
          if [ -n "$PLAYWRIGHT_TEST_EMAIL" ] && [ -n "$PLAYWRIGHT_TEST_PASSWORD" ] \
             && [ -n "$PLAYWRIGHT_TEST_USER_ID" ] && [ -n "$CLERK_SECRET_KEY" ]; then
            echo "E2E secrets present - running Playwright."
          else
            echo "::notice title=E2E tests skipped::Playwright requires the secrets \
          PLAYWRIGHT_TEST_EMAIL, PLAYWRIGHT_TEST_PASSWORD, PLAYWRIGHT_TEST_USER_ID and \
          CLERK_SECRET_KEY, which are not configured on this repository. The E2E step was \
          skipped, not run. Coverage is currently unverified."
          fi

      - name: Checkout code
        if: env.PLAYWRIGHT_TEST_EMAIL != '' && env.PLAYWRIGHT_TEST_PASSWORD != '' && env.PLAYWRIGHT_TEST_USER_ID != '' && env.CLERK_SECRET_KEY != ''
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: env.PLAYWRIGHT_TEST_EMAIL != '' && env.PLAYWRIGHT_TEST_PASSWORD != '' && env.PLAYWRIGHT_TEST_USER_ID != '' && env.CLERK_SECRET_KEY != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        if: env.PLAYWRIGHT_TEST_EMAIL != '' && env.PLAYWRIGHT_TEST_PASSWORD != '' && env.PLAYWRIGHT_TEST_USER_ID != '' && env.CLERK_SECRET_KEY != ''
        run: pnpm install

      - name: Install Playwright browsers
        if: env.PLAYWRIGHT_TEST_EMAIL != '' && env.PLAYWRIGHT_TEST_PASSWORD != '' && env.PLAYWRIGHT_TEST_USER_ID != '' && env.CLERK_SECRET_KEY != ''
        run: pnpm exec playwright install --with-deps

      - name: Setup environment
        if: env.PLAYWRIGHT_TEST_EMAIL != '' && env.PLAYWRIGHT_TEST_PASSWORD != '' && env.PLAYWRIGHT_TEST_USER_ID != '' && env.CLERK_SECRET_KEY != ''
        run: |
          cp .env.example .env
          echo "SKIP_ENV_VALIDATION=true" >> .env

      - name: Run Playwright E2E tests
        if: env.PLAYWRIGHT_TEST_EMAIL != '' && env.PLAYWRIGHT_TEST_PASSWORD != '' && env.PLAYWRIGHT_TEST_USER_ID != '' && env.CLERK_SECRET_KEY != ''
        run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: [type-check, lint, unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build application
        run: pnpm build
        env:
          # See PRODUCTION_DEPLOYMENT_CHECKLIST.md: the build needs a >=4GB heap.
          NODE_OPTIONS: --max-old-space-size=4096

  bundle-analysis:
    runs-on: ubuntu-latest
    needs: [type-check, lint, unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Setup environment
        run: |
          cp .env.example .env
          echo "SKIP_ENV_VALIDATION=true" >> .env

      - name: Bundle analysis
        # Writes the report to .next/diagnostics/analyze and exits without
        # starting the interactive analyzer server.
        run: pnpm analyze
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload bundle report
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: .next/diagnostics/analyze
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: [type-check, lint, unit-tests, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Setup environment
        run: |
          cp .env.example .env
          echo "SKIP_ENV_VALIDATION=true" >> .env

      - name: Run database migrations
        run: pnpm db:push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build application
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
