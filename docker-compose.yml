version: "3.8"

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Clerk Authentication
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_WEBHOOK_SECRET=${CLERK_WEBHOOK_SECRET}

      # Supabase
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}

      # Database (direct Postgres for LangGraph checkpoints)
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/presentation_ai

      # AI / External APIs
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TOGETHER_AI_API_KEY=${TOGETHER_AI_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - UNSPLASH_ACCESS_KEY=${UNSPLASH_ACCESS_KEY}
      - GOOGLE_CUSTOM_SEARCH_API_KEY=${GOOGLE_CUSTOM_SEARCH_API_KEY}
      - SEARCH_ENGINE_CX=${SEARCH_ENGINE_CX}

      # Encryption
      - API_KEY_ENCRYPTION_MASTER_KEY=${API_KEY_ENCRYPTION_MASTER_KEY}

      # Uploadthing
      - UPLOADTHING_TOKEN=${UPLOADTHING_TOKEN}

      # App
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - SKIP_ENV_VALIDATION=true
    depends_on:
      - db
    volumes:
      - /app/node_modules

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=presentation_ai
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
