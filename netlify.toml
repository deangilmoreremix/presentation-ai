[build]
  base = "."
  command = "pnpm build"
  # @netlify/plugin-nextjs expects the Next.js build dir; it generates the
  # serverless/edge functions itself. Do NOT point this at .next/standalone.
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NODE_OPTIONS = "--max-old-space-size=4096"
  SKIP_ENV_VALIDATION = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"
